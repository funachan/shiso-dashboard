name: 人口データ自動更新

on:
  # 毎月5日の午前10時（JST）に自動実行
  # ※宍粟市HPは月初に前月末データを公開するため5日に設定
  schedule:
    - cron: '0 1 5 * *'   # UTC 01:00 = JST 10:00

  # 手動実行も可能（GitHubのActionsタブから「Run workflow」ボタン）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # HTMLファイルをコミットするために必要

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4 openpyxl

      - name: 市HPから人口データを取得して HTML を更新
        run: python scripts/update_population.py

      - name: 変更があればコミット & プッシュ
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: 人口ダッシュボード自動更新（住民基本台帳）'
          file_pattern: 'shiso_dashboard.html'
